name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # npm 10 falla al resolver este árbol de dependencias (bug "edgesOut"); se fija la versión del proyecto
      - run: npm install -g npm@11.20.0

      - run: npm ci --no-fund --no-audit

      # Formato, ESLint (incluye accesibilidad), tests con cobertura >= 80 % y build de producción
      - run: npm run verify

      - name: Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          retention-days: 7