# Bloques para el Nginx central de la VPS (stage). Se agregan a mano, una sola vez:
#   1. Crear en Cloudflare los registros acueductos y acueductos-portal de sandbox-massolutions.uk.
#   2. Agregar los dos dominios al server_name del bloque HTTP (redirect 301) existente en
#      sandbox-massolutions.conf, junto a erp/globalerp/payments.sandbox-massolutions.uk.
#   3. Copiar estos dos bloques y recargar: nginx -t && nginx -s reload
#
# El backend (mas-global-aqueduct-service) no tiene dominio propio: cada contenedor web publica /api en su mismo
# dominio y lo reenvía por la red interna, así que no hay CORS.

# Backoffice: administración de la plataforma y de cada prestador
server {
    listen 443 ssl;
    server_name acueductos.sandbox-massolutions.uk;

    ssl_certificate /etc/ssl/cloudflare/cert.pem;
    ssl_certificate_key /etc/ssl/cloudflare/key.pem;

    # Soportes, documentos, logos y archivos de carga inicial: hasta 5 MB
    client_max_body_size 6m;

    location / {
        proxy_pass http://mas-global-aqueduct-backoffice:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # La IP real del visitante la entrega Cloudflare; el backend limita los intentos de ingreso por IP
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Portal del suscriptor: la dirección del QR de la factura (PORTAL_BASE_URL = https://<este dominio>/p)
server {
    listen 443 ssl;
    server_name acueductos-portal.sandbox-massolutions.uk;

    ssl_certificate /etc/ssl/cloudflare/cert.pem;
    ssl_certificate_key /etc/ssl/cloudflare/key.pem;

    location / {
        proxy_pass http://mas-global-aqueduct-portal:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
